<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人作品集 | 视频与音乐</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0d121f;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #8291a9;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 卡片容器 */
        .card {
            background: #171e2d;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #273143;
        }

        .section-title {
            font-size: 1.25rem;
            color: #31aef6;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        /* 16:9 响应式视频容器 */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 分类标签样式 (Tab) */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #273143;
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid #273143;
            color: #8291a9;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: #31aef6;
            color: #31aef6;
        }

        .tab-btn.active {
            background: #31aef6;
            border-color: #31aef6;
            color: #0d121f;
            font-weight: 600;
        }

        /* 音频列表样式 */
        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .audio-item {
            background: #0d121f;
            padding: 16px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #273143;
        }

        .audio-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-title {
            font-size: 1rem;
            font-weight: 600;
            color: #eef2f7;
        }

        .audio-tag {
            font-size: 0.75rem;
            background: #273143;
            color: #c0cbda;
            padding: 2px 8px;
            border-radius: 4px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 6px;
        }

        footer {
            margin-top: auto;
            padding: 40px 0 20px 0;
            text-align: center;
            color: #526078;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>我的个人作品集</h1>
        <p class="subtitle">视频与音乐精选</p>
    </header>

    <main>
        <section class="card">
            <h2 class="section-title">🎬 视频展示</h2>
            <div class="video-container">
                <iframe src="https://player.bilibili.com/player.html?isOutside=true&aid=116853695319365&bvid=BV1PWTW68EK4&cid=39606225099&p=1&high_quality=1" 
                        scrolling="no" 
                        border="0" 
                        frameborder="no" 
                        framespacing="0" 
                        allowfullscreen="true">
                </iframe>
            </div>
        </section>

        <section class="card">
            <h2 class="section-title">🎵 音乐作品</h2>
            
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="tab-btn" onclick="filterCategory('original', this)">原创作品</button>
                <button class="tab-btn" onclick="filterCategory('orchestral', this)">管弦 / Hybrid</button>
                <button class="tab-btn" onclick="filterCategory('demo', this)">Demo 试听</button>
            </div>

            <div class="audio-list">
                
                <div class="audio-item" data-category="original">
                    <div class="audio-info">
                        <span class="audio-title">Meadow Landscape</span>
                        <span class="audio-tag">原创作品</span>
                    </div>
                    <audio controls src="./audio/Meadow Landscape.mp3"></audio>
                </div>

                <div class="audio-item" data-category="orchestral">
                    <div class="audio-info">
                        <span class="audio-title">Dream Illumination</span>
                        <span class="audio-tag">管弦 / Hybrid</span>
                    </div>
                    <audio controls src="./audio/song2.mp3"></audio>
                </div>

                <div class="audio-item" data-category="demo">
                    <div class="audio-info">
                        <span class="audio-title">第三首作品名称 (Demo)</span>
                        <span class="audio-tag">Demo 试听</span>
                    </div>
                    <audio controls src="./audio/song3.mp3"></audio>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 My Website. Powered by Vercel.</p>
    </footer>

    <script>
        function filterCategory(category, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const items = document.querySelectorAll('.audio-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
